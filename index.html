<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b16" />
  <link rel="icon" type="image/png" sizes="16x16" href="%VITE_PUBLIC_CDN%/assets/favicon16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="%VITE_PUBLIC_CDN%/assets/favicon32x32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="%VITE_PUBLIC_CDN%/assets/favicon192x192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="%VITE_PUBLIC_CDN%/assets/favicon192x192.png" />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/font/WINLINE-SANS_REGULAR.TTF" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/font/WINLINE-SANS_BOLD.TTF" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/font/WINLINE-SANS_BOLD-ITALIC.TTF" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/assets/details/winline-seeklogo%203.svg" as="image" type="image/svg+xml" />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/assets/details/png/image1282.png" as="image" type="image/png" />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/assets/details/png/Maskgroup.png" as="image" type="image/png" />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/assets/details/png/cup.png" as="image" type="image/png" />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/assets/details/png/trophy.png" as="image" type="image/png" />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/assets/details/png/camera.png" as="image" type="image/png" />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/assets/details/png/ball.png" as="image" type="image/png" />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/assets/details/snowball3.png" as="image" type="image/png" />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/assets/loading-backhround.png" as="image" type="image/png" />
  <link rel="preload" href="%VITE_PUBLIC_CDN%/assets/load-bar.png" as="image" type="image/png" />
  <style>
    @font-face {
      font-family: "WINLINE Sans";
      src: url("%VITE_PUBLIC_CDN%/font/WINLINE-SANS_REGULAR.TTF") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "WINLINE Sans";
      src: url("%VITE_PUBLIC_CDN%/font/WINLINE-SANS_BOLD.TTF") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "WINLINE Sans";
      src: url("%VITE_PUBLIC_CDN%/font/WINLINE-SANS_BOLD-ITALIC.TTF") format("truetype");
      font-weight: 700;
      font-style: italic;
      font-display: swap;
    }
  </style>
  <title>Шар предсказаний Winline</title>
</head>

<body>
  <main id="app" aria-label="Шар предсказаний Winline">
    <section id="start-screen" aria-label="Начальный экран">
      <img id="start-logo" src="%VITE_PUBLIC_CDN%/assets/details/winline-seeklogo%203.svg" alt="Winline" />
      <img id="start-headphone" class="start-img" src="%VITE_PUBLIC_CDN%/assets/details/png/image1282.png" alt="">
      <img id="start-keyboard" class="start-img" src="%VITE_PUBLIC_CDN%/assets/details/png/Maskgroup.png" alt="">

      <div id="start-cup-group" class="start-img" aria-hidden="true">
        <img id="start-cup" src="%VITE_PUBLIC_CDN%/assets/details/png/cup.png" alt="">
      </div>


      <img id="start-trophy" class="start-img" src="%VITE_PUBLIC_CDN%/assets/details/png/trophy.png" alt="">
      <img id="start-camera" class="start-img" src="%VITE_PUBLIC_CDN%/assets/details/png/camera.png" alt="">
      <img id="start-ball" class="start-img" src="%VITE_PUBLIC_CDN%/assets/details/png/ball.png" alt="">
      <div class="start-content">
        <div id="start-snowball" aria-hidden="true">
          <img id="start-snowball-image" src="%VITE_PUBLIC_CDN%/assets/details/snowball3.png" alt="">
        </div>
        <div class="container-text">
          <h2 class="container-text__header">
            <div class="container-text__header_first">ТВОЯ ИГРА</div>
          </h2>
          <div class="container-text__content">
            <div class="container-text__header_second">НАЧИНАЕТСЯ</div>
            <p class="container-text_mini">Каким будет твой год?<br/> Переходи дальше и получи предсказание,<br/> какой получится твоя
              карьера в Winline.</p>
            <button id="start-button" type="button">НАЧАТЬ</button>
          </div>
        </div>
      </div>
    </section>
    <section id="loading-screen" class="is-hidden" aria-label="Загрузка 3D-модели" aria-hidden="true">
      <div class="loading-background" aria-hidden="true"></div>
      <div class="loading-content">
        <img
          class="loading-logo"
          data-src="assets/details/winline-seeklogo%203.svg"
          alt="Winline"
        />
        <div
          id="loading-bar"
          class="loading-bar"
          role="progressbar"
          aria-label="Прогресс загрузки"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        ></div>
        <p id="loading-label" class="loading-label">Загрузка...</p>
        <p id="loading-progress" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true">0%</p>
      </div>
    </section>
    <div id="scene-environment" aria-hidden="true">
      <div class="scene-environment__plane">
        <picture>
          <source media="(max-width: 767px)" srcset="%VITE_PUBLIC_CDN%/assets/main-page/background-top-767.png">
          <img class="scene-environment__background scene-environment__background--top" data-src="assets/main-page/background-top.png" alt="">
        </picture>
        <img class="scene-environment__background scene-environment__background--bottom" data-src="assets/main-page/background-bottom.png" alt="">
      </div>
    </div>
    <div id="scene-decorations" aria-hidden="true">
      <picture class="scene-decoration scene-decoration--top-center">
        <source media="(max-width: 767px)" srcset="%VITE_PUBLIC_CDN%/assets/main-page/top-center-767.png">
        <img data-src="assets/main-page/top-center.png" alt="">
      </picture>
      <div class="scene-decoration scene-decoration--left-center">
        <img class="scene-left-center__layer scene-left-center__mirror" data-src="assets/main-page/left-center/mirror1.png" alt="">
        <picture class="scene-left-center__layer scene-left-center__light">
          <source media="(max-width: 767px)" srcset="%VITE_PUBLIC_CDN%/assets/main-page/left-center/light-767.png">
          <img data-src="assets/main-page/left-center/light.png" alt="">
        </picture>
        <picture class="scene-left-center__layer scene-left-center__main">
          <source media="(max-width: 767px)" srcset="%VITE_PUBLIC_CDN%/assets/main-page/left-center/main-767.png">
          <img data-src="assets/main-page/left-center/main.png" alt="">
        </picture>
      </div>
      <div class="scene-decoration scene-decoration--right-center">
        <img class="scene-right-center__layer scene-right-center__mirror" data-src="assets/main-page/right-center/mirror.png" alt="">
        <img class="scene-right-center__layer scene-right-center__main" data-src="assets/main-page/right-center/main.png" alt="">
      </div>
    </div>
    <div id="scene" aria-hidden="true"></div>
    <div id="scene-foreground-decorations" aria-hidden="true">
      <img class="scene-decoration scene-decoration--left-bottom" data-src="assets/main-page/left-bottom.png" alt="">
      <img class="scene-decoration scene-decoration--right-bottom" data-src="assets/main-page/right-bottom.png" alt="">
    </div>
    <div id="scene-actions" class="scene-actions is-hidden">
      <p id="scene-shake-hint" class="scene-shake-hint" hidden>Потряси телефон или нажми на кнопку</p>
      <button id="prediction-button" class="scene-prediction-button" type="button">ПОЛУЧИТЬ ПРЕДСКАЗАНИЕ</button>
    </div>
    <div id="prediction-modal" class="prediction-modal" hidden>
      <div class="prediction-modal__dialog" role="dialog" aria-modal="true" aria-label="Предсказание">
        <img id="prediction-card-image" class="prediction-modal__card-image" alt="">
        <p id="prediction-card-text" class="prediction-modal__text"></p>
        <div class="prediction-modal__actions">
          <button id="prediction-more-button" class="prediction-modal__button prediction-modal__button--primary" type="button">ПОЛУЧИТЬ ЕЩЕ</button>
          <a class="prediction-modal__button prediction-modal__button--secondary" href="https://hh.ru/" target="_blank" rel="noopener noreferrer">ПЕРЕЙТИ НА HH.RU</a>
        </div>
      </div>
    </div>
    <button id="shake-test" type="button" hidden>
      Тест тряски
    </button>
    <p id="motion-permission-status" role="status" aria-live="polite" hidden></p>
  </main>
  <script type="module" src="/src/app.js"></script>
</body>

</html>
